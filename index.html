<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিজিটাল আড্ডা AI - পদক্ষেপ ডিজিটাল</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .ai-container { background: white; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; border: 2px solid #ff9800; }
        .header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #ddd; }
        .header h3 { color: #ff9800; margin: 0; font-size: 20px; }
        .content-body { padding: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #ff9800; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #e68a00; }
        #resultArea { margin-top: 20px; padding: 15px; background: #fff8f0; border-radius: 8px; border: 1px solid #ffe0b2; min-height: 100px; line-height: 1.6; color: #333; }
        .loading { color: #ff9800; font-style: italic; }
    </style>
</head>
<body>

<div class="ai-container">
    <div class="header">
        <h3>🤖 ডিজিটাল আড্ডা AI (বিশ্ব জ্ঞান)</h3>
    </div>
    
    <div class="content-body">
        <input type="text" id="userInput" placeholder="Tense বা যেকোনো বিষয় লিখুন...">
        <button onclick="askGeminiAI()">বিস্তারিত জানুন (BN + EN)</button>

        <div id="resultArea">
            অপেক্ষা করছি... একটি শব্দ লিখে সার্চ দিন।
        </div>
    </div>
</div>

<script>
    // আপনার API KEY এখানে বসান
    const MY_API_KEY = "এখানে_আপনার_API_KEY_বসান"; 

    async function askGeminiAI() {
        const input = document.getElementById("userInput").value.trim();
        const result = document.getElementById("resultArea");

        if (!input) {
            result.innerHTML = "<span style='color:red;'>দুঃখিত, দয়া করে একটি শব্দ লিখুন।</span>";
            return;
        }

        result.innerHTML = "<span class='loading'>AI তথ্য খুঁজছে... দয়া করে অপেক্ষা করুন।</span>";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: `Explain '${input}' in simple Bengali and English together. Use points or tables if needed.` }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let formattedText = data.candidates[0].content.parts[0].text
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') // বোল্ড টেক্সট ঠিক করা
                    .replace(/\n/g, '<br>'); // নিউ লাইন ঠিক করা
                
                result.innerHTML = formattedText;
            } else {
                result.innerHTML = "দুঃখিত, সঠিক তথ্য পাওয়া যায়নি।";
            }

        } catch (error) {
            result.innerHTML = "সার্ভারে সমস্যা হচ্ছে। আপনার API Key চেক করুন।";
            console.error(error);
        }
    }
</script>

</body>
</html>
