<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মন্দির সেবা</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #FF6F00; --bg: #FFF5E6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .navbar { background: var(--primary); padding: 25px; text-align: center; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .om { font-size: 14px; background: white; color: var(--primary); display: inline-block; padding: 2px 15px; border-radius: 20px; margin-top: 8px; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 15px; padding-bottom: 80px; }
        .card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 6px solid #FF3D00; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: #4CAF50; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1 style="margin:0;">🚩 মন্দির সেবা</h1>
        <div class="om">ওম তৎ সৎ</div>
    </div>
    <div class="container">
        <div class="card">
            <h3 style="margin:0; color:var(--primary);">নতুন আপডেট দিন</h3>
            <input type="text" id="tName" placeholder="মন্দিরের নাম...">
            <input type="text" id="tDist" placeholder="জেলা বা এলাকা...">
            <textarea id="tInfo" placeholder="আজ কি বিশেষ পূজা বা প্রসাদ আছে?"></textarea>
            <button class="btn" onclick="postToDB()">লাইভ পাবলিশ করুন</button>
        </div>
        <h3 style="color:#E65100;">📢 লাইভ মন্দির আপডেট:</h3>
        <div id="userFeed">অপেক্ষা করুন...</div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AlzaSyBIJw59geMwvYUSO5OSaXwekTkzXibTcio",
            authDomain: "mandir-seba.firebaseapp.com",
            databaseURL: "https://mandir-seba-default-rtdb.firebaseio.com",
            projectId: "mandir-seba",
            storageBucket: "mandir-seba.firebasestorage.app",
            messagingSenderId: "657641053910",
            appId: "1:657641053910:web:2557c1b1580303871e3377"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        function postToDB() {
            const name = document.getElementById('tName').value;
            const dist = document.getElementById('tDist').value;
            const info = document.getElementById('tInfo').value;
            if(name && info) {
                db.ref('updates/').push({
                    name: name,
                    dist: dist,
                    info: info,
                    time: new Date().toLocaleString('bn-BD')
                });
                document.getElementById('tName').value=''; 
                document.getElementById('tInfo').value='';
                alert("পাবলিশ সফল!");
            }
        }
        db.ref('updates/').on('value', (snap) => {
            const data = snap.val();
            let html = '';
            if(data) {
                for(let id in data) {
                    html = `
                    <div class="card">
                        <h4 style="margin:0; color:#BF360C;">${data[id].name} (${data[id].dist})</h4>
                        <p style="margin:10px 0;">${data[id].info}</p>
                        <small>সময়: ${data[id].time}</small>
                    </div>` + html;
                }
                document.getElementById('userFeed').innerHTML = html;
            } else {
                document.getElementById('userFeed').innerHTML = "আপাতত কোনো আপডেট নেই।";
            }
        });
    </script>
</body>
</html>
