<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>॥ ওঁ তৎ সৎ ॥ মন্দির সেবা</title>
    <style>
        :root { --main-bg: #FFF5E6; --accent: #FF4500; --card-bg: white; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--main-bg); margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #FF8C00, #FF4500); color: white; text-align: center; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 1px solid #ffcc80; }
        
        .step-label { font-weight: bold; color: #d35400; margin-bottom: 8px; display: block; font-size: 14px; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 2px solid #ffe0b2; background: #fffaf0; font-size: 16px; outline: none; transition: 0.3s; }
        select:focus { border-color: var(--accent); }

        /* পপ-আপ স্টাইল */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 10% auto; border-radius: 25px; width: 85%; max-width: 400px; overflow: hidden; position: relative; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from {transform: translateY(100px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        
        .close { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; color: white; text-shadow: 0 0 10px #000; z-index: 10; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 4px solid var(--accent); }
        .modal-text { padding: 20px; text-align: justify; }
        .modal-text h3 { margin: 0 0 10px 0; color: var(--accent); border-bottom: 1px solid #eee; padding-bottom: 10px; }

        .footer { text-align: center; padding: 20px; margin-top: 20px; border-top: 1px dashed #ffa726; color: #555; font-size: 13px; }
        .creator { color: var(--accent); font-weight: bold; font-size: 15px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-size: 14px;">॥ ওঁ তৎ সৎ ॥</span>
    <h1 style="margin: 5px 0; font-size: 24px;">🚩 মন্দির সেবা</h1>
</div>

<div class="container">
    <div class="card">
        <label class="step-label">১. বিভাগ নির্বাচন করুন:</label>
        <select id="division" onchange="updateDistricts()">
            <option value="">বিভাগ বেছে নিন</option>
            <option value="khulna">খুলনা</option>
            <option value="dhaka">ঢাকা</option>
            <option value="chittagong">চট্টগ্রাম</option>
            <option value="rajshahi">রাজশাহী</option>
            <option value="sylhet">সিলেট</option>
            <option value="barisal">বরিশাল</option>
            <option value="rangpur">রংপুর</option>
            <option value="mymensingh">ময়মনসিংহ</option>
        </select>

        <label class="step-label">২. জেলা নির্বাচন করুন:</label>
        <select id="district" onchange="updateUpazilas()" disabled>
            <option value="">আগে বিভাগ বেছে নিন</option>
        </select>

        <label class="step-label">৩. থানা ও মন্দির নির্বাচন করুন:</label>
        <select id="upazila" onchange="showTempleInfo()" disabled>
            <option value="">আগে জেলা বেছে নিন</option>
        </select>
    </div>

    <div class="footer">
        © ২০২৬ মন্দির সেবা অ্যাপ<br>
        পরিকল্পনা ও রূপায়ণে: <br>
        <span class="creator">SUJON BISWAS</span>
    </div>
</div>

<div id="templeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePopup()">×</span>
        <img id="mImg" src="" class="modal-img" alt="মন্দিরের ছবি">
        <div class="modal-text">
            <h3 id="mTitle"></h3>
            <p id="mDesc"></p>
        </div>
    </div>
</div>

<script>
    // ডাটাব্যাংক: বিভাগ > জেলা > থানা > মন্দিরের তথ্য
    const db = {
        'khulna': {
            'jhinaidaho': {
                'সদর': { n: 'শ্রী শ্রী রামকৃষ্ণ মন্দির', i: 'https://images.unsplash.com/photo-1544011761-399dbd28bc43?q=80&w=400', d: 'ঝিনাইদহ সদরে অবস্থিত একটি পবিত্র ধর্মীয় কেন্দ্র।' },
                'কোটচাঁদপুর': { n: 'কোটচাঁদপুর কালী মন্দির', i: 'https://images.unsplash.com/photo-1590059132213-9ec610474667?q=80&w=400', d: 'ঐতিহাসিক ও জাগ্রত কালী মন্দির যা অত্যন্ত প্রাচীন।' }
            },
            'khulna_dist': {
                'রূপসা': { n: 'রূপসা মহাশ্মশান মন্দির', i: 'https://images.unsplash.com/photo-1621274403997-37aae184f494?q=80&w=400', d: 'খুলনার রূপসা ঘাটে অবস্থিত অন্যতম সুন্দর মন্দির।' }
            }
        },
        'dhaka': {
            'dhaka_dist': {
                'রমনা': { n: 'রমনা কালী মন্দির', i: 'https://upload.wikimedia.org/wikipedia/commons/8/82/Ramna_Kali_Mandir.jpg', d: 'ঢাকার প্রাণকেন্দ্রে অবস্থিত ঐতিহাসিক মন্দির।' },
                'চকবাজার': { n: 'ঢাকেশ্বরী জাতীয় মন্দির', i: 'https://upload.wikimedia.org/wikipedia/commons/8/8f/Dhakeshwari_National_Temple_02.jpg', d: 'বাংলাদেশের জাতীয় মন্দির এবং অন্যতম পবিত্র স্থান।' }
            }
        }
        // এভাবে ৬৪ জেলার সব তথ্য এখানে সাজানো যায়
    };

    function updateDistricts() {
        const div = document.getElementById('division').value;
        const distSelect = document.getElementById('district');
        distSelect.innerHTML = '<option value="">জেলা বেছে নিন</option>';
        distSelect.disabled = true;
        document.getElementById('upazila').innerHTML = '<option value="">আগে জেলা বেছে নিন</option>';
        document.getElementById('upazila').disabled = true;

        if (div && db[div]) {
            distSelect.disabled = false;
            for (let dist in db[div]) {
                distSelect.options.add(new Option(dist.charAt(0).toUpperCase() + dist.slice(1), dist));
            }
        }
    }

    function updateUpazilas() {
        const div = document.getElementById('division').value;
        const dist = document.getElementById('district').value;
        const upSelect = document.getElementById('upazila');
        upSelect.innerHTML = '<option value="">থানা ও মন্দির বেছে নিন</option>';

        if (dist && db[div][dist]) {
            upSelect.disabled = false;
            for (let up in db[div][dist]) {
                upSelect.options.add(new Option(up, up));
            }
        } else { upSelect.disabled = true; }
    }

    function showTempleInfo() {
        const div = document.getElementById('division').value;
        const dist = document.getElementById('district').value;
        const up = document.getElementById('upazila').value;
        const data = db[div][dist][up];

        if (data) {
            document.getElementById('mImg').src = data.i;
            document.getElementById('mTitle').innerText = data.n;
            document.getElementById('mDesc').innerText = data.d;
            document.getElementById('templeModal').style.display = 'block';
        }
    }

    function closePopup() { document.getElementById('templeModal').style.display = 'none'; }
    window.onclick = function(e) { if(e.target == document.getElementById('templeModal')) closePopup(); }
</script>
</body>
</html>
