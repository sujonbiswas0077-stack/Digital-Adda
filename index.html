<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>॥ ওঁ তৎ সৎ ॥ মন্দির সেবা</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: sans-serif; background: #FFF5E6; margin: 0; padding: 0; }
        .header { background: linear-gradient(to bottom, #FF8C00, #FF4500); color: white; text-align: center; padding: 20px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; margin-top: -25px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #28a745; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .info-box { background: white; border-radius: 10px; border-top: 5px solid #FF4500; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .news-item { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; text-align: left; }
        .news-item a { color: #007bff; text-decoration: none; font-weight: bold; }
        
        .update-box { background: white; padding: 15px; border-radius: 10px; border-left: 6px solid #FF4500; margin-bottom: 15px; text-align: left; }
        .map-btn { display: inline-block; margin-top: 10px; background: #4285F4; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-size:20px; font-weight:bold;">॥ ওঁ তৎ সৎ ॥</span>
    <h1>🚩 মন্দির সেবা</h1>
</div>

<div class="container">
    <div class="card">
        <input type="text" id="mName" placeholder="মন্দিরের নাম...">
        <input type="text" id="mArea" placeholder="যশোর/ঢাকা/সঠিক জেলা...">
        <textarea id="mInfo" placeholder="আজকের সংবাদ বা প্রসাদ..." rows="2"></textarea>
        <button class="btn-submit" onclick="publish()">লাইভ পাবলিশ ও ম্যাপ তৈরি</button>
    </div>

    <div class="info-box" style="border-top-color: #4285F4;">
        <h4 style="margin:0 0 10px 0; color:#4285F4;">📰 ধর্মীয় লাইভ নিউজ (পত্রিকা)</h4>
        <div id="newsContent">নিউজ লোড হচ্ছে...</div>
    </div>

    <div class="info-box">
        <h4 style="margin:0 0 10px 0; color:#FF4500;">📅 আসন্ন উৎসব ২০২৬</h4>
        <div style="font-size:14px;">
            <p><b>১৫ ফেব:</b> মহাশিবরাত্রি</p>
            <p><b>০৩ মার্চ:</b> দোলযাত্রা</p>
            <p><b>২০ অক্টো:</b> বিজয়া দশমী (দুর্গাপূজা)</p>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
    var firebaseConfig = {
        apiKey: "AIzaSyBIJw59geMwvYUSO50SaXwekTkzXibTcio",
        authDomain: "mandir-seba.firebaseapp.com",
        projectId: "mandir-seba",
        databaseURL: "https://mandir-seba-default-rtdb.firebaseio.com",
        appId: "1:657641053910:web:2557c1b1580303871e3377"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    var db = firebase.database();

    // নিউজ লোড করার নতুন সিস্টেম
    function fetchNews() {
        // এই লিঙ্কটি সরাসরি নিউজ টেনে আনবে
        const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://www.prothomalo.com/religion/hinduism/rss';
        
        fetch(feedUrl)
        .then(res => res.json())
        .then(data => {
            let html = "";
            if(data.items) {
                data.items.slice(0, 5).forEach(item => {
                    html += `<div class="news-item">🔹 <a href="${item.link}" target="_blank">${item.title}</a></div>`;
                });
                document.getElementById('newsContent').innerHTML = html;
            }
        })
        .catch(() => {
            document.getElementById('newsContent').innerHTML = "নিউজ পেতে ইন্টারনেট সংযোগ চেক করুন।";
        });
    }

    function publish() {
        var n = document.getElementById('mName').value;
        var a = document.getElementById('mArea').value;
        var i = document.getElementById('mInfo').value;
        
        if(n && a) {
            // এখন ম্যাপ আপনার নিজের ঠিকানা নয়, বরং ইনপুট করা জায়গার ঠিকানা দেখাবে
            var mapUrl = "https://www.google.com/maps/search/" + encodeURIComponent(n + " " + a);
            
            db.ref('temple_updates').push({
                name: n, area: a, info: i, map: mapUrl, time: new Date().toLocaleTimeString()
            }).then(() => {
                alert("পাবলিশ হয়েছে!");
                document.getElementById('mName').value = ""; document.getElementById('mArea').value = ""; document.getElementById('mInfo').value = "";
            });
        }
    }

    db.ref('temple_updates').on('value', function(snap) {
        var l = document.getElementById('list');
        l.innerHTML = "<h3>সাম্প্রতিক আপডেট:</h3>";
        snap.forEach(function(c) {
            var v = c.val();
            l.innerHTML += `<div class="update-box"><b>${v.name}</b> (${v.area})<p>${v.info}</p><a href="${v.map}" target="_blank" class="map-btn">📍 ম্যাপে দেখুন</a></div>`;
        });
    });

    fetchNews();
</script>
</body>
</html>
